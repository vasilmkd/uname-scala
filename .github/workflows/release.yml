name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            name: Linux arm64
          - os: macos-15-intel
            target: macos-x86_64
            name: macOS x86_64
          - os: macos-latest
            target: macos-arm64
            name: macOS arm64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build and test binary
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(sed -n 's/^[[:space:]]*version[[:space:]]*:=[[:space:]]*"\([^"]*\)".*/\1/p' build.sbt)

          echo "Expected version from tag: $EXPECTED_VERSION"
          echo "Project version from build.sbt: $PROJECT_VERSION"

          if [ "$PROJECT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Error: Project version in build.sbt ($PROJECT_VERSION) does not match expected tag version ($EXPECTED_VERSION)!" >&2
            exit 1
          fi

          sbt test nativeLinkReleaseFull

          BINARY=$(find target -type f -name "uname-scala-release-full" | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "Error: binary not found in target directory!" >&2
            exit 1
          fi

          DEST="uname-scala-${{ matrix.target }}"
          cp "$BINARY" "$DEST"

          BIN_VERSION=$("./$DEST" --version)
          if [ "$BIN_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Error: Binary output version ($BIN_VERSION) does not match expected version ($EXPECTED_VERSION)!" >&2
            exit 1
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            strip -x "$DEST" || true
            shasum -a 256 "$DEST" > "$DEST.sha256"
          else
            strip -s "$DEST" || true
            sha256sum "$DEST" > "$DEST.sha256"
          fi

          chmod +x "$DEST"

      - name: Upload binary and checksum artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uname-scala-${{ matrix.target }}
          path: |
            uname-scala-${{ matrix.target }}
            uname-scala-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          chmod +x uname-scala-linux-* uname-scala-macos-*
          sha256sum -c *.sha256
          echo "All checksums verified successfully:"
          for f in *.sha256; do
            cat "$f"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/uname-scala-*
          generate_release_notes: true
